
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up</title>
    <link rel="stylesheet" href="../CSS/login.css">
</head>
<body>

    <main class="container">

        <div class="card" id="card">

            <!-- LOGIN -->
            <section class="form login">
                <h1>Welcome back</h1>
                <p class="subtitle">Ingresá a tu cuenta</p>

                <form>
                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" placeholder="tu@email.com" required>
                    </div>

                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" placeholder="Tu contraseña" required>
                    </div>

                    <div class="forgot">
                        <a href="#">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button type="submit" class="submit">
                        Login
                    </button>
                </form>

                <p class="switch">
                    ¿No tenés una cuenta?
                    <button type="button" onclick="flipCard()">
                        Sign Up
                    </button>
                </p>
            </section>


            <!-- SIGN UP -->
            <section class="form signup">
                <h1>Create account</h1>
                <p class="subtitle">Registrate para comenzar</p>

                <form>
                    <div class="input-group">
                        <label>Nombre</label>
                        <input type="text" placeholder="Tu nombre" required>
                    </div>

                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" placeholder="tu@email.com" required>
                    </div>

                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" placeholder="Crear contraseña" required>
                    </div>

                    <div class="input-group">
                        <label>Confirmar contraseña</label>
                        <input type="password" placeholder="Repetir contraseña" required>
                    </div>

                    <button type="submit" class="submit">
                        Create account
                    </button>
                </form>

                <p class="switch">
                    ¿Ya tenés una cuenta?
                    <button type="button" onclick="flipCard()">
                        Login
                    </button>
                </p>
            </section>

        </div>
    </main>

    <script src="script.js"></script>
</body>



<script>


    
const card = document.getElementById("card");

function flipCard() {
    card.classList.toggle("flipped");
}

</script>
</html>
